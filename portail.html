<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chloé & Marin — Espace invités</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #site {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    #musicButton {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 9999;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,.12);
      background: rgba(255,255,255,.95);
      box-shadow: 0 4px 15px rgba(0,0,0,.15);
      font-size: 20px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <iframe id="site" src="app.html" title="Espace invités"></iframe>

  <button id="musicButton" type="button" title="Musique">
    🎵
  </button>

  <audio
    id="weddingMusic"
    loop
    preload="auto"
    src="Alex%20Warren%20-%20Ordinary%20%28Official%20Music%20Video%29.mp3">
  </audio>

  <script>
    const music = document.getElementById("weddingMusic");
    const button = document.getElementById("musicButton");

    button.addEventListener("click", async () => {
      if (music.paused) {
        try {
          await music.play();
        } catch (error) {
          console.log("Lecture impossible :", error);
        }
      } else {
        music.pause();
      }

      updateButton();
    });

    music.addEventListener("play", updateButton);
    music.addEventListener("pause", updateButton);

    function updateButton() {
      button.textContent = music.paused ? "🎵" : "🔊";
    }
  </script>

</body>
</html>
