
<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Connexion — Chloé & Marin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="auth-shell">
    <section class="card auth-card">
      <p class="eyebrow">Espace invité</p>
      <h1>Bienvenue</h1>
      <p class="muted">Saisissez l’identifiant personnel indiqué sur votre invitation.</p>

      <form id="loginForm">
        <label for="guestId">Votre identifiant</label>
        <input
          id="guestId"
          name="guestId"
          autocomplete="off"
          autocapitalize="characters"
          placeholder="Ex. JEAN-DUPONT-42"
          required
        >
        <button class="button full" type="submit">
          Accéder à mon espace
        </button>
      </form>

      <p id="loginMessage" class="message" role="status"></p>
      <a class="text-link" href="index.html">Retour à l’accueil</a>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js?v=20261109-3"></script>
<script src="music.js"></script>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (event) => {
      event.preventDefault();

      const message = document.getElementById('loginMessage');
      const input = document.getElementById('guestId');

      message.textContent = 'Vérification…';
      message.className = 'message';

      try {
        const guest = await MarriageApp.findGuest(input.value);

        if (!guest) {
          throw new Error("Identifiant introuvable. Vérifiez l’identifiant inscrit sur votre invitation.");
        }

        console.log("Profil invité enregistré :", guest);

        MarriageApp.saveSession(guest);

        location.href = 'app.html';
      } catch (error) {
        message.textContent = error.message;
        message.className = 'message error';
      }
    });
  </script>
</body>
</html>
