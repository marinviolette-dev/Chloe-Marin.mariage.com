
<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Un message pour vous — Chloé & Marin</title>
  <link rel="stylesheet" href="style.css?v=20261110-2">
</head>

<body>
  <header class="topbar">
    <a class="brand" href="app.html">Chloé & Marin</a>

    <button class="ghost-button" onclick="MarriageApp.logout()">
      Déconnexion
    </button>
  </header>

  <main class="page">
    <section class="welcome">
      <p class="eyebrow">Un petit mot pour vous</p>
      <h1 id="messageTitle">Message des mariés pour vous</h1>

      <p class="muted">
        Parce que chaque invité compte pour nous.
      </p>
    </section>

    <section class="card" style="text-align:center;">

      <img
        src="message-maries.png.png"
        alt="Enveloppe avec un sceau C&M"
        style="display:block;width:100%;max-width:420px;height:240px;object-fit:cover;border-radius:14px;margin:0 auto 28px;"
      >

      <p style="font-size:1.05rem;line-height:1.8;">
        <span id="guestMessage">
          Chargement de votre petit mot...
        </span>
      </p>

      <p style="margin-top:28px;font-style:italic;">
        Avec toute notre affection,
        <br>
        Chloé & Marin
      </p>

    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js?v=20261109-5"></script>

  <script>
    (async function () {

      const guest = MarriageApp.requireSession();

      if (!guest) return;

      const rawFirstName = String(guest.first_name || "").trim();
      const firstName = rawFirstName.split(/\s+/)[0];

      const titleElement =
        document.getElementById("messageTitle");

      const messageElement =
        document.getElementById("guestMessage");

      if (firstName) {
        titleElement.textContent =
          "Un petit message pour " + firstName;
      }

      const inviteCode = guest.invite_code;

      if (!inviteCode) {
        messageElement.textContent =
          "Impossible de retrouver votre code d'invitation.";
        return;
      }

      try {

        const C = window.MARRIAGE_CONFIG;

        const response = await fetch(
          `${C.supabase.url}/functions/v1/${C.functions.getPersonalMessage}`,
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
              "apikey": C.supabase.anonKey,
              "Authorization": `Bearer ${C.supabase.anonKey}`
            },

            body: JSON.stringify({
              inviteCode: inviteCode
            })
          }
        );

        let data = {};

        try {
          data = await response.json();
        } catch (error) {
          data = {};
        }

        if (!response.ok) {
          throw new Error(
            data.error ||
            data.message ||
            "Impossible de charger votre message."
          );
        }

        if (!data.message) {
          messageElement.textContent =
            "Votre petit mot arrivera bientôt...";
          return;
        }

        messageElement.textContent = data.message;

      } catch (error) {

        console.error(
          "Erreur lors du chargement du message :",
          error
        );

        messageElement.textContent =
          "Votre petit mot n'a pas pu être chargé. Merci de réessayer un peu plus tard.";

      }

    })();
  </script>
</body>
</html>
